# C# SDK CI — mirrors Python/Java/Go SDK pipeline layout
# unit:  zero-credential, zero-network, always runs
# integ: real-credential, allow_failure, skipped without env vars

stages:
  - unit
  - integ

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/

unit:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - openapi
  stage: unit
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    # Explicitly unset all credential variables so unit tests cannot
    # accidentally reach a live endpoint.
    TIGER_ID: ""
    TIGER_PRIVATE_KEY: ""
    TIGER_LICENSE: ""
  script:
    - dotnet restore
    - dotnet build --no-restore -c Release
    - dotnet test TigerOpenAPI.Tests/TigerOpenAPI.Tests.csproj
        --no-build -c Release
        --filter "Category!=Integration"
        --logger "junit;LogFilePath=test-results/unit.xml"
        --collect:"XPlat Code Coverage"
  artifacts:
    reports:
      junit: test-results/unit.xml
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3}%)$/'

integ:
  stage: integ
  image: mcr.microsoft.com/dotnet/sdk:10.0
  allow_failure: true
  script:
    - dotnet restore
    - dotnet build --no-restore -c Release
    - dotnet test TigerOpenAPI.Tests/TigerOpenAPI.Tests.csproj
        --no-build -c Release
        --filter "Category=Integration"
        --logger "junit;LogFilePath=test-results/integ.xml"
  artifacts:
    reports:
      junit: test-results/integ.xml
    expire_in: 7 days
  rules:
    - if: $TIGER_ID != "" && $TIGER_PRIVATE_KEY != ""

# Pipeline result notification via chat webhook.
notify:webhook:
  image: python:3.11-slim
  tags:
    - openapi
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  tags:
    - openapi
  image: python:3.11-slim
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then echo "WEBHOOK_URL not configured, skipping"; exit 0; fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl --fail -sS --max-time 10 --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "")
      HAS_FAILED="no"
      FAILED_JOBS=""
      if [ -n "$JOBS_JSON" ] && command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json; js=json.load(sys.stdin); failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]; print('yes' if failed else 'no'); print(', '.join(failed))" 2>/dev/null || printf 'no\n')
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        if [ "$CI_PIPELINE_STATUS" != "success" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then TITLE="❌ Pipeline failed"; COLOR="red"; fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"; fi
      TEST_REPORT=$(curl --fail -sS --max-time 10 --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/test_report" 2>/dev/null || echo "")
      TEST_STATS=""
      if [ -n "$TEST_REPORT" ] && command -v python3 >/dev/null 2>&1; then
        TEST_STATS=$(printf '%s' "$TEST_REPORT" | python3 -c "import sys,json; r=json.load(sys.stdin); t=r.get('total',{}); print(f"{t.get('count',0)} tests: {t.get('success',0)} passed, {t.get('failed',0)} failed, {t.get('skipped',0)} skipped")" 2>/dev/null)
      fi
      if [ -n "$TEST_STATS" ]; then
        CONTENT="${CONTENT}\n**Tests:** ${TEST_STATS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {"msg_type":"interactive","card":{"header":{"title":{"tag":"plain_text","content":"$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},"template":"$COLOR"},"elements":[{"tag":"div","text":{"tag":os.environ["CARD_CONTENT_TAG"],"content":"$CONTENT"}}]}}
      EOF
      )
      curl --fail -sS --max-time 10 -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d "$PAYLOAD"
