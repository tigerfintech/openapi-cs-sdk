# C# SDK CI — mirrors Python SDK pipeline layout
# unit:  zero-credential, zero-network, always runs
# integ: real-credential, allow_failure, skipped without env vars
#
# Integration credentials: TIGER_ID, TIGER_PRIVATE_KEY, TIGER_LICENSE
# env vars set in GitLab CI Variables (Protected + Masked).

stages:
  - unit
  - integ

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/packages/

.dotnet_base:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - openapi
  before_script:
    - dotnet restore

unit:
  extends: .dotnet_base
  stage: unit
  variables:
    # Explicitly unset all credential variables so unit tests cannot
    # accidentally reach a live endpoint.
    TIGER_ID: ""
    TIGER_PRIVATE_KEY: ""
    TIGER_LICENSE: ""
  script:
    - mkdir -p test-results
    - dotnet build --no-restore -c Release
    - >-
        dotnet test TigerOpenAPI.Tests/TigerOpenAPI.Tests.csproj
        --no-build -c Release
        --filter "FullyQualifiedName!~SerializationContractTest&Category!=Integration"
        --logger "junit;LogFilePath=${CI_PROJECT_DIR}/test-results/unit.xml"
        --collect:"XPlat Code Coverage"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/unit.xml
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3}%)$/'

integ:
  extends: .dotnet_base
  stage: integ
  allow_failure: true
  when: always
  script:
    - mkdir -p test-results
    - dotnet build --no-restore -c Release
    - dotnet test TigerOpenAPI.Tests/TigerOpenAPI.Tests.csproj
        --no-build -c Release
        --filter "FullyQualifiedName!~SerializationContractTest&Category=Integration"
        --logger "junit;LogFilePath=${CI_PROJECT_DIR}/test-results/integ.xml"
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/integ.xml
    expire_in: 7 days
  rules:
    - if: $TIGER_ID != "" && $TIGER_PRIVATE_KEY != ""

# Pipeline result notification via chat webhook.
# Parses JUnit XML artifacts directly (no GitLab API dependency, no curl).
notify:webhook:
  image: python:3.11-slim
  tags:
    - openapi
  stage: .post
  when: always
  allow_failure: true
  needs:
    - job: unit
      artifacts: true
    - job: integ
      artifacts: true
      optional: true
  script:
    - |
      python3 << 'PYEOF'
      import os, json, urllib.request
      import xml.etree.ElementTree as ET

      webhook_url = os.environ.get("WEBHOOK_URL", "")
      if not webhook_url:
          print("WEBHOOK_URL not configured, skipping notification")
          exit(0)
      card_content_tag = os.environ["CARD_CONTENT_TAG"]

      # 1. Parse JUnit XML artifacts — split unit/integration stats
      def parse_xml(path):
          t, f, s = 0, 0, 0
          try:
              tree = ET.parse(path)
              root = tree.getroot()
              print(f"DEBUG {path}: root={root.tag}")
              for suite in root.iter("testsuite"):
                  print(f"  suite attrs: {dict(suite.attrib)}")
                  t += int(suite.get("tests", suite.get("testcasecount", 0)))
                  f += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s += int(suite.get("skipped", 0))
                  f += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s += int(suite.get("skipped", 0))
              # Try JunitXml.TestLogger: <test-run testcasecount=N ...>
              if t == 0:
                  for run in root.iter("test-run"):
                      t = int(run.get("testcasecount", 0))
                      f = int(run.get("failures", 0)) + int(run.get("errors", 0))
                      s = int(run.get("skipped", 0))
          except Exception as e:
              print(f"Failed to parse {path}: {e}")
          return t, t - f - s, f, s

      unit_t, unit_p, unit_f, unit_s = parse_xml("test-results/unit.xml")
      integ_t, integ_p, integ_f, integ_s = parse_xml("test-results/integ.xml")

      unit_stats = f"Unit: {unit_t} tests: {unit_p} passed, {unit_f} failed, {unit_s} skipped" if unit_t > 0 else ""
      integ_stats = f"Integration: {integ_t} tests: {integ_p} passed, {integ_f} failed, {integ_s} skipped" if integ_t > 0 else ""

      # 2. Determine pass/fail: unit test failures = pipeline failed
      has_failed = unit_f > 0
      status = os.environ.get("CI_PIPELINE_STATUS", "")
      if status == "failed":
          has_failed = True

      # 3. Build notification card
      title = "❌ Pipeline failed" if has_failed else "✅ Pipeline passed"
      color = "red" if has_failed else "green"
      project_name = os.environ.get("CI_PROJECT_NAME", "")
      branch = os.environ.get("CI_COMMIT_REF_NAME", "")
      commit = os.environ.get("CI_COMMIT_SHORT_SHA", "")
      pipeline_iid = os.environ.get("CI_PIPELINE_IID", "")
      pipeline_url = os.environ.get("CI_PROJECT_URL", "") + "/-/pipelines/" + os.environ.get("CI_PIPELINE_ID", "")

      content = f"**Repo:** {project_name}\n**Branch:** {branch}\n**Commit:** {commit}\n"
      if unit_stats:
          content += f"\n**Unit tests:** {unit_stats}\n"
      if integ_stats:
          content += f"**Integration tests:** {integ_stats}\n"
      content += f"[View pipeline]({pipeline_url})"

      print(f"===CONTENT===\n{content}\n===END===")

      payload = {
          "msg_type": "interactive",
          "card": {
              "header": {
                  "title": {"tag": "plain_text", "content": f"{title} #{pipeline_iid} — {project_name}"},
                  "template": color
              },
              "elements": [
                  {"tag": "div", "text": {"tag": card_content_tag, "content": content}}
              ]
          }
      }

      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
      try:
          with urllib.request.urlopen(req, timeout=10) as resp:
              result = json.loads(resp.read())
              print(f"Webhook response: {result}")
      except Exception as e:
          print(f"Webhook request failed: {e}")
      PYEOF
